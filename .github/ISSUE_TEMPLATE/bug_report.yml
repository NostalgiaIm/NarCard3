name: Bug report
description: Report a reproducible problem in the website or editor
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include passwords, tokens, private articles, or other sensitive data. Security vulnerabilities must be reported through the private link on the template chooser.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Astro website
        - Browser Markdown editor
        - Tauri desktop editor
        - Build, CI, or documentation
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release, branch, or commit hash where the problem occurs.
      placeholder: "Exp / c52c9ee"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, browser, Node.js, and Rust versions that are relevant.
      placeholder: "Windows 11, Node.js 22.20, Rust stable"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest repeatable sequence.
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove credentials, personal paths, private content, and other sensitive data first.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: This is not a security vulnerability.
          required: true
        - label: I removed secrets and private content from this report.
          required: true
