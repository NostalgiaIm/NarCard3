[package]
name = "narcard-editor"
version = "0.1.0"
description = "NarCard local Astro editor"
authors = ["NarCard"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
image = { version = "0.25", default-features = false, features = ["webp", "jpeg", "png", "gif", "bmp", "ico", "tiff"] }
git2 = "0.21"

[features]
custom-protocol = ["tauri/custom-protocol"]
